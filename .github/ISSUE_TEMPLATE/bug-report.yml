name: バグ報告
description: 再現可能な不具合を報告します
body:
  - type: textarea
    id: reproduction
    attributes:
      label: 再現手順
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期待する結果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 実際の結果
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Play・Android・端末のバージョン
