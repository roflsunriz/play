name: 不具合報告
description: 再現可能な不具合を報告します
body:
  - type: markdown
    attributes:
      value: |-
        再現可能な不具合を報告します。対象環境、再現手順、期待した結果と実際の結果を整理してください。
        導入・利用・開発方法は [README](https://github.com/roflsunriz/play/blob/HEAD/README.md) を確認してください。
        本文と添付に秘密情報や個人情報を含めないでください。脆弱性の詳細は公開せず、[セキュリティ方針](https://github.com/roflsunriz/play/blob/HEAD/SECURITY.md) を確認してください。
  - type: checkboxes
    id: preflight
    attributes:
      label: 事前確認
      options:
        - label: 同じ内容の既存Issueを検索しました。
          required: true
        - label: READMEと関連する利用・更新手順を確認しました。
          required: true
  - type: input
    id: environment
    attributes:
      label: Play・Android・端末のバージョン
  - type: textarea
    id: reproduction
    attributes:
      label: 再現手順
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期待した結果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 実際の結果
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: 診断情報
      description: 秘密情報を除いたログやスクリーンショットを添付できます。
  - type: textarea
    id: additional
    attributes:
      label: 補足
      description: 発生頻度、直前の更新、影響範囲、回避策など。
  - type: checkboxes
    id: privacy
    attributes:
      label: 公開情報の確認
      options:
        - label: 本文・ログ・画像・添付から、認証情報、Cookie、トークン、秘密鍵、個人情報を除いたことを確認しました。
          required: true
title: '[Bug] '
labels:
  - bug
