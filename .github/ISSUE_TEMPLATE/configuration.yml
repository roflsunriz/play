name: 設定・互換性の相談
description: OAuthや端末設定に関する問題を報告します
body:
  - type: markdown
    attributes:
      value: |-
        設定・適用方法と、期待した結果・実際の結果を共有してください。
        導入・利用・開発方法は [README](https://github.com/roflsunriz/play/blob/HEAD/README.md) を確認してください。
        本文と添付に秘密情報や個人情報を含めないでください。脆弱性の詳細は公開せず、[セキュリティ方針](https://github.com/roflsunriz/play/blob/HEAD/SECURITY.md) を確認してください。
  - type: markdown
    attributes:
      value: Client ID、トークン、Cookie、個人情報は投稿しないでください。
  - type: checkboxes
    id: preflight
    attributes:
      label: 事前確認
      options:
        - label: 同じ内容の既存Issueを検索しました。
          required: true
        - label: READMEと関連する利用・更新手順を確認しました。
          required: true
  - type: textarea
    id: setup
    attributes:
      label: 秘密情報を除いた設定と手順
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: 表示されたエラー
    validations:
      required: true
  - type: textarea
    id: environment-details
    attributes:
      label: 対象環境
      description: アプリ・ツール・OS・端末の版と導入方法を記載してください。
    validations:
      required: true
  - type: textarea
    id: expected-result
    attributes:
      label: 期待した結果
    validations:
      required: true
  - type: textarea
    id: additional
    attributes:
      label: 補足
  - type: checkboxes
    id: privacy
    attributes:
      label: 公開情報の確認
      options:
        - label: 本文・ログ・画像・添付から、認証情報、Cookie、トークン、秘密鍵、個人情報を除いたことを確認しました。
          required: true
title: '[Config] '
labels:
  - configuration
