name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v4
      - name: Android SDK
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"
      - name: Verify
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug
      - name: Prepare signing key
        shell: pwsh
        env:
          PLAY_KEYSTORE_BASE64: ${{ secrets.PLAY_KEYSTORE_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PLAY_KEYSTORE_BASE64)) { throw "PLAY_KEYSTORE_BASE64 is required" }
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP/play-release.jks", [Convert]::FromBase64String($env:PLAY_KEYSTORE_BASE64))
      - name: Build signed release APK
        env:
          PLAY_STORE_PASSWORD: ${{ secrets.PLAY_STORE_PASSWORD }}
          PLAY_KEY_ALIAS: ${{ secrets.PLAY_KEY_ALIAS }}
          PLAY_KEY_PASSWORD: ${{ secrets.PLAY_KEY_PASSWORD }}
        run: >-
          ./gradlew assembleRelease
          -Pplay.release.storeFile="$RUNNER_TEMP/play-release.jks"
          -Pplay.release.storePassword="$PLAY_STORE_PASSWORD"
          -Pplay.release.keyAlias="$PLAY_KEY_ALIAS"
          -Pplay.release.keyPassword="$PLAY_KEY_PASSWORD"
      - name: Extract changelog
        shell: pwsh
        run: ./.github/scripts/extract-changelog.ps1 -Version "${{ github.ref_name }}" -Output release-notes.md
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: app/build/outputs/apk/release/app-release.apk
          fail_on_unmatched_files: true
