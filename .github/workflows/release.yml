name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v4.0.1
        with:
          packages: platform-tools
      - name: Android SDK
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"
      - name: Verify and build release
        run: ./gradlew testDebugUnitTest lintDebug assembleRelease
      - name: Verify release version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $metadata = Get-Content -Raw app/build/outputs/apk/release/output-metadata.json | ConvertFrom-Json
          if ($metadata.applicationId -ne "io.github.playmusic") { throw "Unexpected application ID" }
          if ($metadata.elements.Count -ne 1) { throw "Expected one universal APK" }
          if ("v$($metadata.elements[0].versionName)" -ne $env:RELEASE_TAG) { throw "Tag and APK version differ" }
      - name: Extract changelog
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: ./.github/scripts/extract-changelog.ps1 -Version $env:RELEASE_TAG -Output release-notes.md
      - name: Sign and verify APK
        shell: pwsh
        env:
          PLAY_KEYSTORE_BASE64: ${{ secrets.PLAY_KEYSTORE_BASE64 }}
          PLAY_STORE_PASSWORD: ${{ secrets.PLAY_STORE_PASSWORD }}
          PLAY_KEY_ALIAS: ${{ secrets.PLAY_KEY_ALIAS }}
          PLAY_KEY_PASSWORD: ${{ secrets.PLAY_KEY_PASSWORD }}
        run: |
          $keystore = Join-Path $env:RUNNER_TEMP 'play-release.p12'
          try {
            if ([string]::IsNullOrWhiteSpace($env:PLAY_KEYSTORE_BASE64)) { throw 'Release signing secret is required' }
            [IO.File]::WriteAllBytes($keystore, [Convert]::FromBase64String($env:PLAY_KEYSTORE_BASE64))
            $metadata = Get-Content -Raw app/build/outputs/apk/release/output-metadata.json | ConvertFrom-Json
            $version = $metadata.elements[0].versionName
            ./tools/sign-release.ps1 -Apk app/build/outputs/apk/release/app-release-unsigned.apk -Version $version -KeyStore $keystore -KeyAlias $env:PLAY_KEY_ALIAS -Output "build/outputs/play-$version.apk" -AndroidSdk $env:ANDROID_HOME
          } finally {
            Remove-Item -LiteralPath $keystore -ErrorAction SilentlyContinue
          }
      - name: Upload verified release artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: play-${{ github.ref_name }}
          path: |
            build/outputs/*.apk
            build/outputs/*.apk.sha256
            release-notes.md
          if-no-files-found: error
      - name: Publish release
        uses: softprops/action-gh-release@v3.0.3
        with:
          body_path: release-notes.md
          files: |
            build/outputs/*.apk
            build/outputs/*.apk.sha256
          fail_on_unmatched_files: true
