name: Release build

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v4.0.1
      - name: Android SDK
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"
      - name: Verify and build release
        run: ./gradlew testDebugUnitTest lintDebug assembleRelease
      - name: Verify release version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $metadata = Get-Content -Raw app/build/outputs/apk/release/output-metadata.json | ConvertFrom-Json
          if ($metadata.applicationId -ne "io.github.playmusic") { throw "Unexpected application ID" }
          if ($metadata.elements.Count -ne 1) { throw "Expected one universal APK" }
          if ("v$($metadata.elements[0].versionName)" -ne $env:RELEASE_TAG) { throw "Tag and APK version differ" }
      - name: Extract changelog
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: ./.github/scripts/extract-changelog.ps1 -Version $env:RELEASE_TAG -Output release-notes.md
      - name: Upload verified APK for local signing
        uses: actions/upload-artifact@v7.0.1
        with:
          name: play-${{ github.ref_name }}-unsigned
          path: |
            app/build/outputs/apk/release/app-release-unsigned.apk
            app/build/outputs/apk/release/output-metadata.json
            release-notes.md
          if-no-files-found: error
